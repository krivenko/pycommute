name: Build and test

on:
  push:
    branches:
      - master
      - ci
  pull_request:
    branches:
      - master

# Cancel existing runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os-compiler:
          # Ubuntu
          - {os: "ubuntu-latest", cc: "gcc-14", cxx: "g++-14"}
          - {os: "ubuntu-latest", cc: "clang", cxx: "clang++"}
          # macOS aarch64
          - {os: "macos-latest", cc: "gcc-15", cxx: "g++-15"}
          - {os: "macos-latest", cc: "clang", cxx: "clang++"}
          # macOS x86-64
          # macos-15-intel is probably the last supported macOS x86-64 runner
          # https://github.com/actions/runner-images/issues/13074
          - {os: "macos-15-intel", cc: "gcc-15", cxx: "g++-15"}
          - {os: "macos-15-intel", cc: "clang", cxx: "clang++"}

    runs-on: ${{ matrix.os-compiler.os }}
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Install libcommute
      run: |
           git clone https://github.com/krivenko/libcommute
           mkdir libcommute.build && pushd libcommute.build
           cmake ../libcommute                                                \
              -DCMAKE_INSTALL_PREFIX=${GITHUB_WORKSPACE}/libcommute.installed \
              -DTESTS=OFF                                                     \
              -DEXAMPLES=OFF
           make install
           popd

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
           python -m pip install --upgrade pip
           pip install pybind11 numpy tox

    - name: Test with tox
      run: |
           export LIBCOMMUTE_DIR=${GITHUB_WORKSPACE}/libcommute.installed
           export LIBCOMMUTE_INCLUDEDIR=${LIBCOMMUTE_DIR}/include
           export CC="${{ matrix.os-compiler.cc }}"
           export CXX="${{ matrix.os-compiler.cxx }}"
           tox -e py

    - name: Lint with flake8
      run: |
           pip install flake8
           flake8 .
